[project]
name = "batch03-k3-ai-product-hackathon"
version = "0.1.0"
description = "AI track-pathway advisor using Google Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.15.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
